services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  CPSIT\MyraCloudConnector\:
    resource: '../Classes/*'
    exclude: ['../Classes/Domain/{DTO,Enum}']

  cache.myracloud:
    class: CPSIT\MyraCloudConnector\Cache\MyraCacheFrontend
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['myracloud']
